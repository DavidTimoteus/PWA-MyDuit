<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background squircle gradient: signature emerald forest green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="55%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>

    <!-- Wallet body gradient: coklat leather modern -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4B2A"/>
      <stop offset="50%" stop-color="#5C3318"/>
      <stop offset="100%" stop-color="#3E2010"/>
    </linearGradient>

    <!-- Wallet highlight (inner light top-left) -->
    <linearGradient id="walletHighlight" x1="0%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Koin emas gradient -->
    <radialGradient id="coinGrad" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Koin specular shine -->
    <radialGradient id="coinShine" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Claymorphism drop-shadow filter (outset) -->
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1E3A8A" flood-opacity="0.45"/>
    </filter>

    <!-- Soft glow for coin -->
    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>

    <!-- Inner bevel highlight -->
    <filter id="innerBevel">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip for squircle background -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="150" ry="150"/>
    </clipPath>
  </defs>

  <!-- === LAYER 1: Background squircle dengan claymorphism 3-shadow === -->
  <rect width="512" height="512" rx="150" ry="150" fill="url(#bgGrad)"/>

  <!-- Inset highlight atas-kiri (clay inset terang) -->
  <rect width="512" height="512" rx="150" ry="150"
        fill="none"
        stroke="rgba(255,255,255,0.22)"
        stroke-width="32"
        stroke-dashoffset="0"
        clip-path="url(#squircleClip)"/>

  <!-- Soft inner glow top-left on bg -->
  <ellipse cx="160" cy="140" rx="200" ry="160"
           fill="rgba(255,255,255,0.07)"/>

  <!-- === LAYER 2: Wallet body (dompet kulit 3D tactile) === -->
  <!-- Wallet shadow/clay outset -->
  <g filter="url(#clayShadow)">
    <!-- Wallet main body -->
    <rect x="80" y="180" width="340" height="240" rx="36" ry="36"
          fill="url(#walletGrad)"/>
  </g>

  <!-- Wallet inner dark inset (clay inset gelap kanan-bawah) -->
  <rect x="80" y="180" width="340" height="240" rx="36" ry="36"
        fill="none"
        stroke="rgba(0,0,0,0.28)"
        stroke-width="12"
        clip-path="url(#squircleClip)"/>

  <!-- Wallet inner highlight (clay inset terang kiri-atas) -->
  <rect x="80" y="180" width="340" height="240" rx="36" ry="36"
        fill="url(#walletHighlight)"/>

  <!-- Wallet clasp / flap line -->
  <line x1="80" y1="278" x2="420" y2="278"
        stroke="rgba(0,0,0,0.25)" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="274" x2="420" y2="274"
        stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round"/>

  <!-- Card slot visible in wallet -->
  <rect x="108" y="300" width="120" height="72" rx="12" ry="12"
        fill="rgba(0,0,0,0.18)"/>
  <rect x="108" y="300" width="120" height="18" rx="8" ry="8"
        fill="rgba(255,255,255,0.08)"/>

  <!-- Card magnetic stripe simulation -->
  <rect x="118" y="355" width="100" height="8" rx="3"
        fill="rgba(0,0,0,0.3)"/>

  <!-- Wallet stitching detail (top edge) -->
  <rect x="100" y="192" width="300" height="4" rx="2"
        fill="rgba(255,255,255,0.08)"/>

  <!-- === LAYER 3: Koin emas berkilau 3D (menyembul dari dompet) === -->
  <g filter="url(#coinGlow)">
    <!-- Coin shadow base -->
    <ellipse cx="356" cy="222" rx="90" ry="90"
             fill="rgba(217,119,6,0.35)" transform="translate(6,12)"/>

    <!-- Coin body -->
    <circle cx="356" cy="210" r="90"
            fill="url(#coinGrad)"/>

    <!-- Coin rim (edge bevel) -->
    <circle cx="356" cy="210" r="90"
            fill="none"
            stroke="#D97706"
            stroke-width="6"/>
    <circle cx="356" cy="210" r="84"
            fill="none"
            stroke="rgba(254,243,199,0.5)"
            stroke-width="3"/>

    <!-- Coin inner ring -->
    <circle cx="356" cy="210" r="68"
            fill="none"
            stroke="rgba(217,119,6,0.5)"
            stroke-width="4"/>

    <!-- Coin specular reflection -->
    <circle cx="356" cy="210" r="90"
            fill="url(#coinShine)"/>

    <!-- Rp symbol on coin -->
    <text x="356" y="225"
          font-family="'Segoe UI', Arial, sans-serif"
          font-size="72"
          font-weight="900"
          fill="#92400E"
          text-anchor="middle"
          dominant-baseline="central"
          opacity="0.75">Rp</text>

    <!-- Coin text highlight overlay -->
    <text x="354" y="222"
          font-family="'Segoe UI', Arial, sans-serif"
          font-size="72"
          font-weight="900"
          fill="rgba(254,243,199,0.35)"
          text-anchor="middle"
          dominant-baseline="central">Rp</text>
  </g>

  <!-- === LAYER 4: Glints / sparkle kecil (aksen premium) === -->
  <!-- Sparkle kiri atas -->
  <g transform="translate(138,128)" opacity="0.9">
    <polygon points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5"
             fill="#FEF3C7"/>
  </g>
  <!-- Sparkle kecil kanan -->
  <g transform="translate(458,320)" opacity="0.7">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2"
             fill="#FBBF24"/>
  </g>
  <!-- Sparkle tiny -->
  <g transform="translate(96,370)" opacity="0.5">
    <polygon points="0,-5 1.25,-1.25 5,0 1.25,1.25 0,5 -1.25,1.25 -5,0 -1.25,-1.25"
             fill="#93C5FD"/>
  </g>
</svg>
